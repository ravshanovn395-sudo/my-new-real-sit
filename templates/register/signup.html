<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan O'tish | Style Center</title>
    <style>
            * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; 
    }

    body { 
        background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%); 
        background-size: 200% 200%;
        animation: gradientShift 10s ease infinite;
        color: #f8fafc; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        padding: 20px;
        overflow-x: hidden;
    }

    /* Ambient canvas background movement */
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card { 
        background: rgba(30, 41, 59, 0.75); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 40px; 
        border-radius: 20px; 
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); 
        width: 100%; 
        max-width: 480px; 
        position: relative;
        animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardEntrance {
        from {
            opacity: 0;
            transform: translateY(24px) scale(0.96);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .card::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px; right: -1px; bottom: -1px;
        border-radius: 20px;
        padding: 1px;
        background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
        background-size: 200% 100%;
        animation: borderGlow 4s linear infinite;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
    }

    @keyframes borderGlow {
        0% { background-position: 0% 0%; }
        100% { background-position: 200% 0%; }
    }

    .logo {
        text-align: center;
        font-size: 26px;
        font-weight: 800;
        background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
        letter-spacing: 1px;
        animation: shineText 6s linear infinite;
    }

    @keyframes shineText {
        to { background-position: 200% center; }
    }

    h2 { 
        text-align: center; 
        margin-bottom: 28px; 
        color: #94a3b8; 
        font-size: 16px;
        font-weight: 400;
    }

    /* Django {{ form.as_p }} teglari uchun stillar */
    form p { 
        margin-bottom: 20px; 
        display: flex; 
        flex-direction: column; 
        transition: transform 0.2s ease;
    }

    form p:focus-within label {
        color: #38bdf8;
    }

    form label { 
        display: block; 
        margin-bottom: 8px; 
        color: #cbd5e1; 
        font-size: 14px; 
        font-weight: 500;
        transition: color 0.2s ease;
    }

    form input { 
        width: 100%; 
        padding: 14px; 
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 10px; 
        font-size: 15px; 
        color: #ffffff;
        outline: none; 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    }

    form input:focus { 
        border-color: #38bdf8; 
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
        background: rgba(15, 23, 42, 0.85);
        transform: translateY(-1px);
    }

    /* Django yordamchi matnlari hamda xatolik ro'yxatlari */
    .helptext { 
        font-size: 12px; 
        color: #64748b; 
        margin-top: 6px; 
        line-height: 1.4;
        transition: color 0.2s ease;
    }

    form p:focus-within .helptext {
        color: #94a3b8;
    }

    .errorlist { 
        font-size: 13px; 
        color: #fca5a5; 
        margin-top: 6px; 
        list-style: none;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        padding: 8px 12px;
        border-radius: 8px;
        animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
    }

    button { 
        width: 100%; 
        padding: 14px; 
        background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); 
        border: none; 
        border-radius: 10px; 
        color: white; 
        font-size: 16px; 
        font-weight: 700; 
        cursor: pointer; 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    button:hover { 
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        filter: brightness(1.1);
    }

    button:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    .switch-link { 
        text-align: center; 
        margin-top: 24px; 
        font-size: 14px; 
        color: #94a3b8; 
    }

    .switch-link a { 
        color: #38bdf8; 
        text-decoration: none; 
        font-weight: 600;
        transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .switch-link a:hover { 
        color: #818cf8;
        text-decoration: underline; 
        text-shadow: 0 0 8px rgba(129, 140, 248, 0.4);
    }
        body {
            background: #f5f5f3;
            color: #171717;
            animation: none;
        }

        .card {
            background: #fff;
            border-color: #dededb;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
        }

        .card::before {
            display: none;
        }

        .logo {
            background: none;
            color: #111;
            -webkit-text-fill-color: #111;
            animation: none;
        }

        h2,
        .switch-link {
            color: #666;
        }

        form label {
            color: #333;
        }

        form input {
            background: #fafaf9;
            border-color: #d6d6d2;
            color: #171717;
        }

        form input:focus {
            border-color: #111;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        .helptext {
            color: #777;
        }

        button {
            background: #111;
            box-shadow: none;
        }

        button:hover {
            background: #333;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
        }

        .switch-link a {
            color: #111;
        }

        .switch-link a:hover {
            color: #555;
            text-shadow: none;
        }

        .errorlist {
            background: #f3f3f1;
            border-color: #d6d6d2;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">Style Center</div>
    <h2>Yangi hisob yaratish</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ro'yxatdan o'tish</button>
    </form>

    <div class="switch-link">
        Akkountingiz bormi? <a href="{% url 'login_page' %}">Tizimga kirish</a>
    </div>
</div>

</body>
</html>
