<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ car.name }} | Style Center</title>
    <style>
            * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
    }

    body { 
        background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
        background-size: 200% 200%;
        animation: gradientBg 8s ease infinite;
        color: #f8fafc; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        padding: 24px;
    }

    /* Background Animation */
    @keyframes gradientBg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Entrance Animation for Card */
    .card { 
        background: rgba(30, 41, 59, 0.85); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); 
        width: 100%; 
        max-width: 550px; 
        overflow: hidden;
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(99, 102, 241, 0.25);
        border-color: rgba(99, 102, 241, 0.4);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .img-container {
        width: 100%;
        height: 300px;
        background: #0f172a;
        overflow: hidden;
    }

    /* Image Zoom Hover Effect */
    .car-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .card:hover .car-img {
        transform: scale(1.05);
    }

    .no-img {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        font-size: 15px;
        font-weight: 500;
    }

    .card-body {
        padding: 28px;
    }

    .car-title {
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
    }

    .car-about {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 24px;
        white-space: pre-line;
    }

    .actions {
        display: flex;
        gap: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 20px;
    }

    /* Button Animations */
    .btn-back {
        flex: 1;
        padding: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        text-align: center;
        text-decoration: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-back:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
    }

    .btn-back:active {
        transform: translateY(0);
    }

    .btn-delete {
        flex: 1;
        padding: 12px;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        color: #ffffff;
        text-align: center;
        text-decoration: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        transition: all 0.2s ease;
    }

    .btn-delete:hover {
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        transform: translateY(-2px);
    }

    .btn-delete:active {
        transform: translateY(0);
    }
        body {
            background: #f5f5f3;
            color: #171717;
            animation: none;
        }

        .card {
            background: #fff;
            border-color: #dededb;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
        }

        .card:hover {
            border-color: #aaa;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
        }

        .img-container {
            background: #eee;
        }

        .no-img {
            color: #666;
        }

        .car-title {
            color: #171717;
        }

        .car-about {
            color: #666;
        }

        .actions {
            border-top-color: #e5e5e2;
        }

        .btn-back,
        .btn-delete {
            background: #111;
            color: #fff;
            box-shadow: none;
        }

        .btn-back:hover,
        .btn-delete:hover {
            background: #333;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="img-container">
        {% if car.image %}
            <img src="{{ car.image.url }}" alt="{{ car.name }}" class="car-img">
        {% else %}
            <div class="no-img">Mahsulot rasmi yuklanmagan</div>
        {% endif %}
    </div>

    <div class="card-body">
        <h1 class="car-title">{{ car.name }}</h1>
        <p class="car-about">{{ car.about }}</p>

        <div class="actions">
            <a href="{% url 'home_page' %}" class="btn-back">← Orqaga</a>
            <a href="{% url 'car_delete' car.id %}" class="btn-delete" onclick="return confirm('Ushbu mahsulotni o\'chirmoqchimisiz?');">O'chirish</a>
        </div>
    </div>
</div>

</body>
</html>
