<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulot qo'shish | Style Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.2), transparent 30%),
                linear-gradient(135deg, #020817 0%, #0f172a 40%, #111827 100%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .card {
            position: relative;
            width: min(540px, 100%);
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 28px;
            padding: 36px 30px 28px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            overflow: hidden;
            animation: rise 0.7s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14), rgba(99, 102, 241, 0.16), transparent 60%);
            pointer-events: none;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(22px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            position: relative;
            text-align: center;
            font-size: clamp(1.7rem, 2vw, 2.2rem);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #7dd3fc, #a78bfa, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-transform: uppercase;
        }

        h2 {
            position: relative;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 26px;
            letter-spacing: 0.02em;
        }

        form {
            position: relative;
            display: grid;
            gap: 18px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        label {
            font-size: 0.86rem;
            font-weight: 600;
            color: #dbeafe;
            letter-spacing: 0.03em;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 14px;
            color: #f8fafc;
            padding: 14px 16px;
            font-size: 0.96rem;
            outline: none;
            transition: all 0.25s ease;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 12px 14px;
            cursor: pointer;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(125, 211, 252, 0.9);
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
            transform: translateY(-1px);
        }

        .btn-submit {
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            padding: 15px 20px;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 30px rgba(99, 102, 241, 0.42);
            filter: brightness(1.06);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        }

        .back-link {
            position: relative;
            text-align: center;
            margin-top: 22px;
            font-size: 0.92rem;
            color: #cbd5e1;
        }

        .back-link a {
            color: #7dd3fc;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link a:hover {
            color: #a78bfa;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 18px 22px;
                border-radius: 20px;
            }

            .logo {
                letter-spacing: 0.08em;
            }

            input[type="text"],
            textarea,
            input[type="file"],
            .btn-submit {
                border-radius: 12px;
            }
        }

        body {
            background: #f5f5f3;
            color: #171717;
        }

        .card {
            background: #fff;
            border-color: #dededb;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .card::before {
            display: none;
        }

        .logo {
            background: none;
            color: #111;
            -webkit-text-fill-color: #111;
        }

        h2,
        .back-link {
            color: #666;
        }

        label {
            color: #333;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            background: #fafaf9;
            border-color: #d6d6d2;
            color: #171717;
        }

        input[type="file"]::file-selector-button {
            margin-right: 12px;
            border: 1px solid #111;
            border-radius: 8px;
            padding: 8px 12px;
            background: #111;
            color: #fff;
            cursor: pointer;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #888;
        }

        input:focus,
        textarea:focus {
            border-color: #111;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        .btn-submit {
            background: #111;
            box-shadow: none;
        }

        .btn-submit:hover {
            background: #333;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
        }

        .back-link a {
            color: #111;
        }

        .back-link a:hover {
            color: #555;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">Style Center</div>
    <h2>Yangi kiyim yoki aksessuar qo'shing</h2>

    <!-- Rasm saqlanishi uchun enctype="multipart/form-data" shart -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Mahsulot nomi</label>
            <input type="text" id="name" name="name" required placeholder="Masalan: Klassik qora palto">
        </div>

        <div class="form-group">
            <label for="about">Mahsulot tavsifi</label>
            <textarea id="about" name="about" required placeholder="Mato, o'lcham va uslub haqida yozing..."></textarea>
        </div>

        <div class="form-group">
            <label for="image">Mahsulot rasmi</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn-submit">Mahsulotni saqlash</button>
    </form>

    <div class="back-link">
        <a href="{% url 'home_page' %}">← Bosh sahifaga qaytish</a>
    </div>
</div>

</body>
</html>
